<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#09090b"/>
  <!-- clapperboard body -->
  <rect x="5" y="15" width="22" height="12" rx="2" fill="white"/>
  <!-- clapperboard top bar -->
  <rect x="5" y="9" width="22" height="7" rx="1.5" fill="white"/>
  <!-- alternating stripes on top bar -->
  <clipPath id="clip">
    <rect x="5" y="9" width="22" height="7" rx="1.5"/>
  </clipPath>
  <g clip-path="url(#clip)">
    <rect x="5"  y="9" width="5" height="7" fill="#09090b"/>
    <rect x="14" y="9" width="5" height="7" fill="#09090b"/>
    <rect x="23" y="9" width="5" height="7" fill="#09090b"/>
  </g>
  <!-- lines on body -->
  <rect x="8" y="19" width="16" height="1.5" rx="0.75" fill="#09090b" opacity="0.15"/>
  <rect x="8" y="22.5" width="16" height="1.5" rx="0.75" fill="#09090b" opacity="0.15"/>
</svg>
